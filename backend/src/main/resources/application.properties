spring.application.name=libreria-vico

# Conexion configurable: las credenciales nunca se guardan en Git.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/libreria_vico?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/vista/

# Las fotos se guardan fuera del JAR y se validan antes de publicarse.
app.upload.products-dir=${PRODUCT_IMAGES_DIR:uploads/products}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

server.port=${SERVER_PORT:8080}
server.error.whitelabel.enabled=false
