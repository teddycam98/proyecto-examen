<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head(${product.id == null ? 'Nuevo producto' : 'Editar producto'})}"></head><body><div class="app-shell">
<aside th:replace="~{fragments/layout :: sidebar}"></aside><main class="main-content"><div th:replace="~{fragments/layout :: alerts}"></div>
<header class="page-header"><div><h1 th:text="${product.id == null ? 'Nuevo producto' : 'Editar producto'}"></h1><p>Los cambios de stock se realizan mediante compras, ventas o ajustes.</p></div><a class="btn btn-outline-secondary" th:href="@{/productos}">Volver</a></header>
<form th:action="@{/productos/guardar}" th:object="${product}" method="post" enctype="multipart/form-data"><input type="hidden" th:field="*{id}"><div class="card"><div class="card-header"><h2 class="card-title">Informacion del producto</h2></div><div class="card-body p-4"><div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
<div class="row g-3"><div class="col-md-4"><label class="form-label">Codigo *</label><input class="form-control" th:field="*{code}" placeholder="Ej. ESC-LAP-AZ"><div class="invalid-feedback" th:errors="*{code}"></div></div><div class="col-md-8"><label class="form-label">Nombre *</label><input class="form-control" th:field="*{name}"><div class="invalid-feedback" th:errors="*{name}"></div></div>
<div class="col-12"><label class="form-label">Descripcion</label><textarea class="form-control" rows="2" th:field="*{description}"></textarea><div class="invalid-feedback" th:errors="*{description}"></div></div>
<div class="col-12"><label class="form-label">Imagen del producto</label><div class="image-upload-field"><img th:if="${product.imageName != null}" class="product-form-preview" th:src="@{/media/productos/{name}(name=${product.imageName})}" alt="Imagen actual"><div class="flex-grow-1"><input class="form-control" type="file" name="imageFile" accept="image/jpeg,image/png,image/webp" data-image-input><small class="text-secondary">JPG, PNG o WEBP. Maximo 5 MB.</small></div></div></div>
<div class="col-md-4"><label class="form-label">Categoria *</label><select class="form-select" th:field="*{category.id}"><option value="">Seleccione</option><option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"></option></select><div class="invalid-feedback" th:errors="*{category}"></div></div>
<div class="col-md-4"><label class="form-label">Proveedor principal</label><select class="form-select" th:field="*{supplier.id}"><option value="">Sin proveedor</option><option th:each="s : ${suppliers}" th:value="${s.id}" th:text="${s.businessName}"></option></select></div>
<div class="col-md-4"><label class="form-label">Unidad de medida *</label><select class="form-select" th:field="*{unitOfMeasure}"><option th:each="u : ${units}" th:value="${u}" th:text="${u.label}"></option></select></div>
<div class="col-md-4"><label class="form-label">Precio de compra *</label><div class="input-group"><span class="input-group-text">S/</span><input type="number" min="0" step="0.01" class="form-control" th:field="*{purchasePrice}"></div><div class="invalid-feedback" th:errors="*{purchasePrice}"></div></div>
<div class="col-md-4"><label class="form-label">Precio de venta *</label><div class="input-group"><span class="input-group-text">S/</span><input type="number" min="0.01" step="0.01" class="form-control" th:field="*{salePrice}"></div><div class="invalid-feedback" th:errors="*{salePrice}"></div></div>
<div class="col-md-4"><label class="form-label">Stock minimo *</label><input type="number" min="0" class="form-control" th:field="*{minimumStock}"><div class="invalid-feedback" th:errors="*{minimumStock}"></div></div>
<div class="col-md-4" th:if="${product.id != null}"><label class="form-label">Stock actual</label><input class="form-control" th:value="${product.stock}" disabled></div><div class="col-md-4 d-flex align-items-end"><div class="form-check form-switch mb-2"><input class="form-check-input" type="checkbox" th:field="*{active}"><label class="form-check-label">Producto activo</label></div></div></div></div>
<div class="card-footer bg-white p-3 text-end"><a class="btn btn-light me-2" th:href="@{/productos}">Cancelar</a><button class="btn btn-primary"><i class="bi bi-check-lg"></i> Guardar producto</button></div></div></form>
</main></div><th:block th:replace="~{fragments/layout :: scripts}"></th:block></body></html>
