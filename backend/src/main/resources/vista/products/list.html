<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Productos')}"></head><body><div class="app-shell">
<aside th:replace="~{fragments/layout :: sidebar}"></aside><main class="main-content"><div th:replace="~{fragments/layout :: alerts}"></div>
<header class="page-header"><div><h1>Productos</h1><p>Catalogo y existencias de utiles y articulos de escritorio.</p></div><a class="btn btn-primary" th:href="@{/productos/nuevo}"><i class="bi bi-plus-lg"></i> Nuevo producto</a></header>
<div class="card"><div class="card-header"><form class="row g-2" method="get"><div class="col-md-8"><input class="form-control" name="q" th:value="${q}" placeholder="Buscar por codigo o nombre"></div><div class="col-auto"><button class="btn btn-outline-primary"><i class="bi bi-search"></i> Buscar</button></div></form></div>
<div class="table-responsive"><table class="table"><thead><tr><th>Producto</th><th>Categoria</th><th>Compra</th><th>Venta</th><th>Stock</th><th>Estado</th><th></th></tr></thead><tbody>
<tr th:each="p : ${products}"><td><div class="d-flex align-items-center gap-3"><img class="product-list-thumb" th:alt="${p.name}" th:src="${p.imageName != null} ? @{/media/productos/{name}(name=${p.imageName})} : @{/img/products/default.svg}"><div><div class="fw-semibold" th:text="${p.name}"></div><span class="product-code" th:text="${p.code}"></span></div></div></td><td th:text="${p.category.name}"></td><td th:text="${'S/ ' + #numbers.formatDecimal(p.purchasePrice,1,2)}"></td><td class="money" th:text="${'S/ ' + #numbers.formatDecimal(p.salePrice,1,2)}"></td><td><span class="badge" th:classappend="${p.lowStock} ? 'badge-soft-danger' : 'badge-soft-success'" th:text="${p.stock + ' ' + p.unitOfMeasure.label}"></span></td><td><span class="badge" th:classappend="${p.active} ? 'badge-soft-success' : 'badge-soft-muted'" th:text="${p.active ? 'Activo' : 'Inactivo'}"></span></td><td class="text-end"><a class="btn btn-sm btn-outline-secondary" th:href="@{/productos/{id}/editar(id=${p.id})}"><i class="bi bi-pencil"></i></a> <form class="d-inline" method="post" th:action="@{/productos/{id}/estado(id=${p.id})}" data-confirm="¿Cambiar el estado del producto?"><button class="btn btn-sm btn-outline-secondary"><i class="bi bi-power"></i></button></form></td></tr>
<tr th:if="${#lists.isEmpty(products)}"><td colspan="7" class="empty-state"><i class="bi bi-search"></i>No se encontraron productos.</td></tr></tbody></table></div></div>
</main></div><th:block th:replace="~{fragments/layout :: scripts}"></th:block></body></html>
