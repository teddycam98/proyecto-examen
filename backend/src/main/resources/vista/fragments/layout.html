<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title + ' | Libreria Vico'}">Libreria Vico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
</head>
<body>
<aside th:fragment="sidebar" class="sidebar">
    <a class="brand" th:href="@{/}">
        <span class="brand-mark">V</span>
        <span><strong>Libreria Vico</strong><small>Inventario y ventas</small></span>
    </a>
    <nav class="nav flex-column">
        <a class="nav-link" th:href="@{/}"><i class="bi bi-grid-1x2"></i> Resumen</a>
        <span class="nav-label">OPERACIONES</span>
        <a class="nav-link" th:href="@{/ventas}"><i class="bi bi-receipt"></i> Ventas</a>
        <a class="nav-link" th:href="@{/compras}"><i class="bi bi-box-seam"></i> Compras</a>
        <a class="nav-link" th:href="@{/inventario/movimientos}"><i class="bi bi-arrow-left-right"></i> Movimientos</a>
        <span class="nav-label">CATALOGOS</span>
        <a class="nav-link" th:href="@{/productos}"><i class="bi bi-journal-text"></i> Productos</a>
        <a class="nav-link" th:href="@{/categorias}"><i class="bi bi-tags"></i> Categorias</a>
        <a class="nav-link" th:href="@{/proveedores}"><i class="bi bi-truck"></i> Proveedores</a>
    </nav>
    <div class="sidebar-footer"><span class="status-dot"></span> Sistema operativo</div>
</aside>

<div th:fragment="alerts" class="alerts">
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill"></i> <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle-fill"></i> <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
</div>

<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
</th:block>
</body>
</html>
