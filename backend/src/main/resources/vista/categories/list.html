<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Categorias')}"></head><body><div class="app-shell"><aside th:replace="~{fragments/layout :: sidebar}"></aside><main class="main-content"><div th:replace="~{fragments/layout :: alerts}"></div>
<header class="page-header"><div><h1>Categorias</h1><p>Organiza el catalogo por lineas de productos.</p></div><a class="btn btn-primary" th:href="@{/categorias/nueva}"><i class="bi bi-plus-lg"></i> Nueva categoria</a></header>
<div class="card"><div class="table-responsive"><table class="table"><thead><tr><th>Nombre</th><th>Descripcion</th><th>Estado</th><th></th></tr></thead><tbody><tr th:each="c : ${categories}"><td class="fw-semibold" th:text="${c.name}"></td><td th:text="${c.description ?: '-'}"></td><td><span class="badge" th:classappend="${c.active} ? 'badge-soft-success' : 'badge-soft-muted'" th:text="${c.active ? 'Activa' : 'Inactiva'}"></span></td><td class="text-end"><a class="btn btn-sm btn-outline-secondary" th:href="@{/categorias/{id}/editar(id=${c.id})}"><i class="bi bi-pencil"></i></a> <form class="d-inline" method="post" th:action="@{/categorias/{id}/estado(id=${c.id})}" data-confirm="¿Cambiar el estado de la categoria?"><button class="btn btn-sm btn-outline-secondary"><i class="bi bi-power"></i></button></form></td></tr></tbody></table></div></div>
</main></div><th:block th:replace="~{fragments/layout :: scripts}"></th:block></body></html>
