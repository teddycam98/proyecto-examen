<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Categoria')}"></head><body><div class="app-shell"><aside th:replace="~{fragments/layout :: sidebar}"></aside><main class="main-content">
<header class="page-header"><div><h1 th:text="${category.id == null ? 'Nueva categoria' : 'Editar categoria'}"></h1><p>Clasificacion comercial del inventario.</p></div><a class="btn btn-outline-secondary" th:href="@{/categorias}">Volver</a></header>
<form th:action="@{/categorias/guardar}" th:object="${category}" method="post"><input type="hidden" th:field="*{id}"><div class="card"><div class="card-body p-4"><div th:if="${error}" class="alert alert-danger" th:text="${error}"></div><div class="mb-3"><label class="form-label">Nombre *</label><input class="form-control" th:field="*{name}"><div class="invalid-feedback" th:errors="*{name}"></div></div><div class="mb-3"><label class="form-label">Descripcion</label><textarea class="form-control" rows="3" th:field="*{description}"></textarea><div class="invalid-feedback" th:errors="*{description}"></div></div><div class="form-check form-switch"><input class="form-check-input" type="checkbox" th:field="*{active}"><label class="form-check-label">Categoria activa</label></div></div><div class="card-footer bg-white text-end p-3"><button class="btn btn-primary">Guardar categoria</button></div></div></form>
</main></div><th:block th:replace="~{fragments/layout :: scripts}"></th:block></body></html>
