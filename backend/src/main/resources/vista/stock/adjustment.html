<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Ajuste de inventario')}"></head><body><div class="app-shell"><aside th:replace="~{fragments/layout :: sidebar}"></aside><main class="main-content">
<header class="page-header"><div><h1>Ajuste de inventario</h1><p>Use esta opcion para conteos fisicos, mermas o correcciones justificadas.</p></div><a class="btn btn-outline-secondary" th:href="@{/inventario/movimientos}">Volver</a></header>
<form th:action="@{/inventario/ajuste}" th:object="${adjustmentForm}" method="post"><div class="card"><div class="card-body p-4"><div th:if="${error}" class="alert alert-danger" th:text="${error}"></div><div class="row g-3"><div class="col-md-6"><label class="form-label">Producto *</label><select class="form-select" th:field="*{productId}"><option value="">Seleccione</option><option th:each="p : ${products}" th:value="${p.id}" th:text="${p.code + ' - ' + p.name + ' (stock: ' + p.stock + ')'}"></option></select><div class="invalid-feedback" th:errors="*{productId}"></div></div><div class="col-md-3"><label class="form-label">Tipo *</label><select class="form-select" th:field="*{movementType}"><option th:each="t : ${adjustmentTypes}" th:value="${t}" th:text="${t.label}"></option></select></div><div class="col-md-3"><label class="form-label">Cantidad *</label><input type="number" min="1" class="form-control" th:field="*{quantity}"><div class="invalid-feedback" th:errors="*{quantity}"></div></div><div class="col-12"><label class="form-label">Motivo *</label><textarea class="form-control" rows="3" th:field="*{notes}" placeholder="Explique por que se realiza el ajuste"></textarea><div class="invalid-feedback" th:errors="*{notes}"></div></div></div></div><div class="card-footer bg-white text-end p-3"><button class="btn btn-primary">Registrar ajuste</button></div></div></form>
</main></div><th:block th:replace="~{fragments/layout :: scripts}"></th:block></body></html>
