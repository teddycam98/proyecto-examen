<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Movimientos de inventario')}"></head><body><div class="app-shell"><aside th:replace="~{fragments/layout :: sidebar}"></aside><main class="main-content"><div th:replace="~{fragments/layout :: alerts}"></div>
<header class="page-header"><div><h1>Movimientos de inventario</h1><p>Kardex de entradas, salidas, anulaciones y ajustes.</p></div><a class="btn btn-primary" th:href="@{/inventario/ajuste}"><i class="bi bi-sliders"></i> Registrar ajuste</a></header>
<div class="card"><div class="table-responsive"><table class="table"><thead><tr><th>Fecha</th><th>Producto</th><th>Movimiento</th><th>Cantidad</th><th>Stock anterior</th><th>Stock nuevo</th><th>Referencia</th></tr></thead><tbody><tr th:each="m : ${movements}"><td th:text="${#temporals.format(m.movementDate,'dd/MM/yyyy HH:mm')}"></td><td><div th:text="${m.product.name}"></div><small class="product-code" th:text="${m.product.code}"></small></td><td><span class="badge" th:classappend="${m.movementType.incoming} ? 'badge-soft-success' : 'badge-soft-warning'" th:text="${m.movementType.label}"></span></td><td class="fw-semibold" th:text="${(m.movementType.incoming ? '+' : '-') + m.quantity}"></td><td th:text="${m.previousStock}"></td><td class="fw-semibold" th:text="${m.newStock}"></td><td><div th:text="${m.referenceNumber ?: '-'}"></div><small class="text-secondary" th:text="${m.notes ?: ''}"></small></td></tr><tr th:if="${#lists.isEmpty(movements)}"><td colspan="7" class="empty-state">No existen movimientos.</td></tr></tbody></table></div></div>
</main></div><th:block th:replace="~{fragments/layout :: scripts}"></th:block></body></html>
