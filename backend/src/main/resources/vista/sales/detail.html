<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Detalle de venta')}"></head><body><div class="app-shell"><aside th:replace="~{fragments/layout :: sidebar}"></aside><main class="main-content"><div th:replace="~{fragments/layout :: alerts}"></div>
<header class="page-header"><div><h1>Detalle de venta</h1><p class="product-code" th:text="${sale.saleNumber}"></p></div><div class="d-flex gap-2"><a class="btn btn-outline-secondary" th:href="@{/ventas}">Volver</a><form th:if="${sale.status.name() == 'COMPLETADA'}" method="post" th:action="@{/ventas/{id}/anular(id=${sale.id})}" data-confirm="¿Anular la venta y devolver todos los productos al stock?"><button class="btn btn-outline-danger">Anular venta</button></form></div></header>
<div class="row g-4"><div class="col-lg-4"><div class="card"><div class="card-body"><dl class="detail-list"><dt>Cliente</dt><dd th:text="${sale.customerName}"></dd><dt>Documento</dt><dd th:text="${sale.customerDocument ?: '-'}"></dd><dt>Fecha</dt><dd th:text="${#temporals.format(sale.saleDate,'dd/MM/yyyy HH:mm')}"></dd><dt>Estado</dt><dd><span class="badge" th:classappend="${sale.status.name() == 'COMPLETADA'} ? 'badge-soft-success' : 'badge-soft-danger'" th:text="${sale.status.label}"></span></dd><dt>Total</dt><dd class="transaction-total" th:text="${'S/ ' + #numbers.formatDecimal(sale.total,1,2)}"></dd></dl></div></div></div><div class="col-lg-8"><div class="card"><div class="card-header"><h2 class="card-title">Detalle de productos</h2></div><div class="table-responsive"><table class="table"><thead><tr><th>Producto</th><th>Cantidad</th><th>Precio</th><th>Subtotal</th></tr></thead><tbody><tr th:each="i : ${sale.items}"><td><div th:text="${i.product.name}"></div><small class="product-code" th:text="${i.product.code}"></small></td><td th:text="${i.quantity}"></td><td th:text="${'S/ ' + #numbers.formatDecimal(i.unitPrice,1,2)}"></td><td class="money" th:text="${'S/ ' + #numbers.formatDecimal(i.subtotal,1,2)}"></td></tr></tbody></table></div></div></div></div>
</main></div><th:block th:replace="~{fragments/layout :: scripts}"></th:block></body></html>
