<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Ventas')}"></head><body><div class="app-shell"><aside th:replace="~{fragments/layout :: sidebar}"></aside><main class="main-content"><div th:replace="~{fragments/layout :: alerts}"></div>
<header class="page-header"><div><h1>Ventas</h1><p>Salidas de mercaderia y comprobantes internos.</p></div><a class="btn btn-primary" th:href="@{/ventas/nueva}"><i class="bi bi-plus-lg"></i> Nueva venta</a></header>
<div class="card"><div class="table-responsive"><table class="table"><thead><tr><th>Numero</th><th>Fecha</th><th>Cliente</th><th>Estado</th><th>Total</th><th></th></tr></thead><tbody><tr th:each="s : ${sales}"><td class="product-code" th:text="${s.saleNumber}"></td><td th:text="${#temporals.format(s.saleDate,'dd/MM/yyyy HH:mm')}"></td><td th:text="${s.customerName}"></td><td><span class="badge" th:classappend="${s.status.name() == 'COMPLETADA'} ? 'badge-soft-success' : 'badge-soft-danger'" th:text="${s.status.label}"></span></td><td class="money" th:text="${'S/ ' + #numbers.formatDecimal(s.total,1,2)}"></td><td class="text-end"><a class="btn btn-sm btn-outline-secondary" th:href="@{/ventas/{id}(id=${s.id})}">Ver detalle</a></td></tr><tr th:if="${#lists.isEmpty(sales)}"><td colspan="6" class="empty-state">Aun no hay ventas registradas.</td></tr></tbody></table></div></div>
</main></div><th:block th:replace="~{fragments/layout :: scripts}"></th:block></body></html>
