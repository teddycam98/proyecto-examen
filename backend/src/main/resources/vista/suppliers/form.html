<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Proveedor')}"></head><body><div class="app-shell"><aside th:replace="~{fragments/layout :: sidebar}"></aside><main class="main-content">
<header class="page-header"><div><h1 th:text="${supplier.id == null ? 'Nuevo proveedor' : 'Editar proveedor'}"></h1><p>Datos de contacto y facturacion.</p></div><a class="btn btn-outline-secondary" th:href="@{/proveedores}">Volver</a></header>
<form th:action="@{/proveedores/guardar}" th:object="${supplier}" method="post"><input type="hidden" th:field="*{id}"><div class="card"><div class="card-body p-4"><div th:if="${error}" class="alert alert-danger" th:text="${error}"></div><div class="row g-3"><div class="col-md-8"><label class="form-label">Razon social *</label><input class="form-control" th:field="*{businessName}"><div class="invalid-feedback" th:errors="*{businessName}"></div></div><div class="col-md-4"><label class="form-label">RUC / DNI</label><input class="form-control" th:field="*{documentNumber}"><div class="invalid-feedback" th:errors="*{documentNumber}"></div></div><div class="col-md-6"><label class="form-label">Persona de contacto</label><input class="form-control" th:field="*{contactName}"></div><div class="col-md-3"><label class="form-label">Telefono</label><input class="form-control" th:field="*{phone}"><div class="invalid-feedback" th:errors="*{phone}"></div></div><div class="col-md-3"><label class="form-label">Correo</label><input type="email" class="form-control" th:field="*{email}"><div class="invalid-feedback" th:errors="*{email}"></div></div><div class="col-12"><label class="form-label">Direccion</label><input class="form-control" th:field="*{address}"></div><div class="col-12"><div class="form-check form-switch"><input class="form-check-input" type="checkbox" th:field="*{active}"><label class="form-check-label">Proveedor activo</label></div></div></div></div><div class="card-footer bg-white text-end p-3"><button class="btn btn-primary">Guardar proveedor</button></div></div></form>
</main></div><th:block th:replace="~{fragments/layout :: scripts}"></th:block></body></html>
