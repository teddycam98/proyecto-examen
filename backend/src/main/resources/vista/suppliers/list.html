<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Proveedores')}"></head><body><div class="app-shell"><aside th:replace="~{fragments/layout :: sidebar}"></aside><main class="main-content"><div th:replace="~{fragments/layout :: alerts}"></div>
<header class="page-header"><div><h1>Proveedores</h1><p>Contactos comerciales y abastecimiento.</p></div><a class="btn btn-primary" th:href="@{/proveedores/nuevo}"><i class="bi bi-plus-lg"></i> Nuevo proveedor</a></header>
<div class="card"><div class="table-responsive"><table class="table"><thead><tr><th>Razon social</th><th>RUC / DNI</th><th>Contacto</th><th>Telefono</th><th>Estado</th><th></th></tr></thead><tbody><tr th:each="s : ${suppliers}"><td><div class="fw-semibold" th:text="${s.businessName}"></div><small class="text-secondary" th:text="${s.email ?: ''}"></small></td><td th:text="${s.documentNumber ?: '-'}"></td><td th:text="${s.contactName ?: '-'}"></td><td th:text="${s.phone ?: '-'}"></td><td><span class="badge" th:classappend="${s.active} ? 'badge-soft-success' : 'badge-soft-muted'" th:text="${s.active ? 'Activo' : 'Inactivo'}"></span></td><td class="text-end"><a class="btn btn-sm btn-outline-secondary" th:href="@{/proveedores/{id}/editar(id=${s.id})}"><i class="bi bi-pencil"></i></a> <form class="d-inline" method="post" th:action="@{/proveedores/{id}/estado(id=${s.id})}" data-confirm="¿Cambiar el estado del proveedor?"><button class="btn btn-sm btn-outline-secondary"><i class="bi bi-power"></i></button></form></td></tr></tbody></table></div></div>
</main></div><th:block th:replace="~{fragments/layout :: scripts}"></th:block></body></html>
