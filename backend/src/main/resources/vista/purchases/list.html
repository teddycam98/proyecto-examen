<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Compras')}"></head><body><div class="app-shell"><aside th:replace="~{fragments/layout :: sidebar}"></aside><main class="main-content"><div th:replace="~{fragments/layout :: alerts}"></div>
<header class="page-header"><div><h1>Compras</h1><p>Ingresos de mercaderia procedentes de proveedores.</p></div><a class="btn btn-primary" th:href="@{/compras/nueva}"><i class="bi bi-plus-lg"></i> Nueva compra</a></header>
<div class="card"><div class="table-responsive"><table class="table"><thead><tr><th>Numero</th><th>Fecha</th><th>Proveedor</th><th>Documento</th><th>Estado</th><th>Total</th><th></th></tr></thead><tbody><tr th:each="p : ${purchases}"><td class="product-code" th:text="${p.purchaseNumber}"></td><td th:text="${#temporals.format(p.purchaseDate,'dd/MM/yyyy HH:mm')}"></td><td th:text="${p.supplier.businessName}"></td><td th:text="${p.documentReference ?: '-'}"></td><td><span class="badge" th:classappend="${p.status.name() == 'COMPLETADA'} ? 'badge-soft-success' : 'badge-soft-danger'" th:text="${p.status.label}"></span></td><td class="money" th:text="${'S/ ' + #numbers.formatDecimal(p.total,1,2)}"></td><td class="text-end"><a class="btn btn-sm btn-outline-secondary" th:href="@{/compras/{id}(id=${p.id})}">Ver detalle</a></td></tr><tr th:if="${#lists.isEmpty(purchases)}"><td colspan="7" class="empty-state">Aun no hay compras registradas.</td></tr></tbody></table></div></div>
</main></div><th:block th:replace="~{fragments/layout :: scripts}"></th:block></body></html>
