<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Nueva compra')}"></head><body><div class="app-shell"><aside th:replace="~{fragments/layout :: sidebar}"></aside><main class="main-content">
<header class="page-header"><div><h1>Nueva compra</h1><p>El stock ingresara al confirmar la operacion.</p></div><a class="btn btn-outline-secondary" th:href="@{/compras}">Volver</a></header>
<form th:action="@{/compras}" th:object="${purchaseForm}" method="post" data-transaction-form="purchase"><div th:if="${error}" class="alert alert-danger" th:text="${error}"></div><div class="card mb-4"><div class="card-header"><h2 class="card-title">Documento de compra</h2></div><div class="card-body"><div class="row g-3"><div class="col-md-8"><label class="form-label">Proveedor *</label><select class="form-select" th:field="*{supplierId}"><option value="">Seleccione</option><option th:each="s : ${suppliers}" th:value="${s.id}" th:text="${s.businessName}"></option></select><div class="invalid-feedback" th:errors="*{supplierId}"></div></div><div class="col-md-4"><label class="form-label">Factura / guia</label><input class="form-control" th:field="*{documentReference}" placeholder="Ej. F001-123"></div></div></div></div>
<div class="card"><div class="card-header d-flex justify-content-between align-items-center"><h2 class="card-title">Productos recibidos</h2><button type="button" class="btn btn-sm btn-outline-primary" data-add-item><i class="bi bi-plus-lg"></i> Agregar fila</button></div><div class="table-responsive"><table class="table transaction-table"><thead><tr><th>Producto</th><th>Cantidad</th><th>Costo unitario</th><th>Subtotal</th><th></th></tr></thead><tbody data-items-body>
<tr th:each="item, stat : *{items}"><td><select class="form-select" data-product th:field="*{items[__${stat.index}__].productId}"><option value="">Seleccione</option><option th:each="p : ${products}" th:value="${p.id}" th:text="${p.code + ' - ' + p.name}" th:data-price="${p.purchasePrice}" th:data-stock="${p.stock}"></option></select></td><td><input type="number" min="1" class="form-control" data-quantity th:field="*{items[__${stat.index}__].quantity}"></td><td><div class="input-group"><span class="input-group-text">S/</span><input type="number" min="0.01" step="0.01" class="form-control" data-price th:field="*{items[__${stat.index}__].unitPrice}"></div></td><td class="money" data-subtotal>S/ 0.00</td><td><button type="button" class="btn btn-sm btn-outline-danger" data-remove><i class="bi bi-x-lg"></i></button></td></tr>
</tbody></table></div><div class="card-footer bg-white d-flex justify-content-between align-items-center p-3"><div><span class="text-secondary">Total de la compra</span><div class="transaction-total" data-grand-total>S/ 0.00</div></div><button class="btn btn-primary btn-lg"><i class="bi bi-check2-circle"></i> Confirmar compra</button></div></div>
<template id="item-row-template"><tr><td><select class="form-select" data-product name="items[__INDEX__].productId"><option value="">Seleccione</option><option th:each="p : ${products}" th:value="${p.id}" th:text="${p.code + ' - ' + p.name}" th:data-price="${p.purchasePrice}" th:data-stock="${p.stock}"></option></select></td><td><input type="number" min="1" value="1" class="form-control" data-quantity name="items[__INDEX__].quantity"></td><td><div class="input-group"><span class="input-group-text">S/</span><input type="number" min="0.01" step="0.01" class="form-control" data-price name="items[__INDEX__].unitPrice"></div></td><td class="money" data-subtotal>S/ 0.00</td><td><button type="button" class="btn btn-sm btn-outline-danger" data-remove><i class="bi bi-x-lg"></i></button></td></tr></template>
</form></main></div><th:block th:replace="~{fragments/layout :: scripts}"></th:block></body></html>
