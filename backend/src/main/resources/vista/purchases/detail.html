<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Detalle de compra')}"></head><body><div class="app-shell"><aside th:replace="~{fragments/layout :: sidebar}"></aside><main class="main-content"><div th:replace="~{fragments/layout :: alerts}"></div>
<header class="page-header"><div><h1>Detalle de compra</h1><p class="product-code" th:text="${purchase.purchaseNumber}"></p></div><div class="d-flex gap-2"><a class="btn btn-outline-secondary" th:href="@{/compras}">Volver</a><form th:if="${purchase.status.name() == 'COMPLETADA'}" method="post" th:action="@{/compras/{id}/anular(id=${purchase.id})}" data-confirm="¿Anular la compra y retirar del stock los productos recibidos?"><button class="btn btn-outline-danger">Anular compra</button></form></div></header>
<div class="row g-4"><div class="col-lg-4"><div class="card"><div class="card-body"><dl class="detail-list"><dt>Proveedor</dt><dd th:text="${purchase.supplier.businessName}"></dd><dt>Documento</dt><dd th:text="${purchase.documentReference ?: '-'}"></dd><dt>Fecha</dt><dd th:text="${#temporals.format(purchase.purchaseDate,'dd/MM/yyyy HH:mm')}"></dd><dt>Estado</dt><dd><span class="badge" th:classappend="${purchase.status.name() == 'COMPLETADA'} ? 'badge-soft-success' : 'badge-soft-danger'" th:text="${purchase.status.label}"></span></dd><dt>Total</dt><dd class="transaction-total" th:text="${'S/ ' + #numbers.formatDecimal(purchase.total,1,2)}"></dd></dl></div></div></div><div class="col-lg-8"><div class="card"><div class="card-header"><h2 class="card-title">Detalle de productos</h2></div><div class="table-responsive"><table class="table"><thead><tr><th>Producto</th><th>Cantidad</th><th>Costo</th><th>Subtotal</th></tr></thead><tbody><tr th:each="i : ${purchase.items}"><td><div th:text="${i.product.name}"></div><small class="product-code" th:text="${i.product.code}"></small></td><td th:text="${i.quantity}"></td><td th:text="${'S/ ' + #numbers.formatDecimal(i.unitCost,1,2)}"></td><td class="money" th:text="${'S/ ' + #numbers.formatDecimal(i.subtotal,1,2)}"></td></tr></tbody></table></div></div></div></div>
</main></div><th:block th:replace="~{fragments/layout :: scripts}"></th:block></body></html>
